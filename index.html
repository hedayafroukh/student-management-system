<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Student Management System</h1>
      <p>Manage students easily</p>
    </header>
    <main>
      <section class="student-form">
        <h2>Add Student</h2>

        <form id="studentForm">
          <label for="studentName">Student Name</label>
          <input name="studentName" type="text" id="studentName" required />

          <label for="studentId">Student ID</label>
          <input name="studentId" type="text" id="studentId" required />

          <label for="major">Major</label>
          <select name="major" id="major" required>
            <option value="">Choose Major</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Software Engineering</option>
          </select>

          <label for="gpa">GPA</label>
          <input name="gpa" type="number" id="gpa" step="0.01" required />

          <button class="btn-add" type="submit">Add Student</button>
        </form>
        <p id="successMessage"></p>
      </section>

      <section class="controls">
        <input
          name="search"
          type="text"
          id="search"
          placeholder="Search Student"
        />

        <select name="filterMajor" id="filterMajor">
          <option value="all">All Majors</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Software Engineering">Software Engineering</option>
        </select>

        <select name="sortGpa" id="sortGpa">
          <option value="high">Highest GPA</option>
          <option value="low">Lowest GPA</option>
        </select>
      </section>

      <section class="students">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>ID</th>
              <th>Major</th>
              <th>GPA</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="studentTable"></tbody>
        </table>

        <p class="average">Average GPA: <span id="averageGpa">0.00</span></p>

        <p id="message">No students found.</p>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
